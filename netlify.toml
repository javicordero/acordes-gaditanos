# Panel privado /admin y funciones.
#
# La web sigue siendo 100 % estática: las funciones solo sirven al panel, que
# habla con GitHub para crear ramas y PRs.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /admin/api/* → funciones. Se mantiene /estudio/api/* para el callback antiguo
# de la OAuth App y por si queda alguna URL guardada.
[[redirects]]
  from = "/admin/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/estudio/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Los antiguos paneles de admin viven ahora dentro de /admin, con la misma
# sesión de GitHub.
[[redirects]]
  from = "/admin/stats"
  to = "/admin/?vista=stats"
  status = 301
  force = true

[[redirects]]
  from = "/admin/stats/*"
  to = "/admin/?vista=stats"
  status = 301
  force = true

[[redirects]]
  from = "/admin/comentarios"
  to = "/admin/?vista=comentarios"
  status = 301
  force = true

[[redirects]]
  from = "/admin/comentarios/*"
  to = "/admin/?vista=comentarios"
  status = 301
  force = true

# El panel vivía en /estudio: redirección permanente al nuevo /admin.
[[redirects]]
  from = "/estudio"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/estudio/*"
  to = "/admin/:splat"
  status = 301
  force = true

# Autores que se unificaron con su alias (`ALIAS_AUTORES` en
# src/lib/contenido.ts): su página antigua ya no se genera, así que la URL
# vieja apunta a la buena con un 301.
[[redirects]]
  from = "/autor/musica/german-garcia-rendon"
  to = "/autor/musica/german-rendon"
  status = 301
  force = true

[[redirects]]
  from = "/autor/musica/german-garcia-rendon/*"
  to = "/autor/musica/german-rendon"
  status = 301
  force = true

[[redirects]]
  from = "/autor/musica/angel-luis-silva-benzo"
  to = "/autor/musica/angel-luis-silva"
  status = 301
  force = true

[[redirects]]
  from = "/autor/musica/angel-luis-silva-benzo/*"
  to = "/autor/musica/angel-luis-silva"
  status = 301
  force = true

[[redirects]]
  from = "/autor/musica/juan-manuel-romero-bey"
  to = "/autor/musica/juanma-romero-bey"
  status = 301
  force = true

[[redirects]]
  from = "/autor/musica/juan-manuel-romero-bey/*"
  to = "/autor/musica/juanma-romero-bey"
  status = 301
  force = true

# Cabeceras de seguridad comunes a todo el sitio. Las de caché viven en
# `public/_headers` porque dependen del tipo de archivo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # Impide meter la web en un iframe ajeno: con AdSense y los botones de
    # donación, el clickjacking es el escenario real (clics falsos).
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # APIs que ningún iframe (anuncios incluidos) necesita. No se tocan
    # autoplay ni fullscreen: los usa el iframe de YouTube.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), midi=(), serial=(), bluetooth=()"

# El panel conserva su CSP estricta y el noindex. Las cabeceras comunes ya
# llegan desde la regla `/*`: no repetirlas aquí (Netlify las duplicaría).
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/estudio/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
