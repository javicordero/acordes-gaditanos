<!doctype html>
<html lang='es'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <meta name='robots' content='noindex' />
    <title>Sin conexión - Acordes Gaditanos</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        font-family: 'Roboto Mono', 'Courier New', monospace;
        color: #ffffff;
      }
      .caja {
        width: calc(100% - 32px);
        max-width: 520px;
        padding: 32px;
        border: 2px solid #fca311;
        box-shadow: 10px 10px 0 0 #fca311;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #fca311;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #ffffff;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        background: #fca311;
        color: #111111;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-decoration: none;
        border: 2px solid #fca311;
      }
    </style>
  </head>
  <body>
    <main class='caja'>
      <h1>Sin conexión</h1>
      <p>
        No tienes conexión y esta página no está guardada en tu dispositivo.<br />
        Vuelve a intentarlo cuando tengas red.
      </p>
      <a href='/'>Volver al inicio</a>
    </main>
  </body>
</html>
