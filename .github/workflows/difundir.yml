name: Avisar de coplas nuevas

# Solo cuando un push a master añade ficheros en src/content/acordes.
# El script vuelve a comprobar que sean .md NUEVOS: editar una copla no avisa.
on:
  push:
    branches: [master]
    paths:
      - 'src/content/acordes/**'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué hacer'
        type: choice
        default: prueba
        options:
          - prueba
          - seco
          - reenviar
      slugs:
        description: 'Slugs para reenviar o previsualizar, separados por comas (opcional en modo seco)'
        required: false

permissions:
  contents: read

concurrency:
  group: difundir-telegram
  cancel-in-progress: false

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # Hace falta el commit anterior para saber qué se ha añadido.
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar el aviso
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@acordesgaditanos' }}
          MODO: ${{ inputs.modo }}
          SLUGS: ${{ inputs.slugs }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Ejecución manual en modo: ${MODO}"

            case "${MODO}" in
              prueba)
                node scripts/difundir.mjs --test
                ;;
              seco)
                if [ -n "${SLUGS}" ]; then
                  node scripts/difundir.mjs --solo "${SLUGS}" --dry-run
                else
                  node scripts/difundir.mjs --antes HEAD~1 --dry-run
                fi
                ;;
              reenviar)
                if [ -z "${SLUGS}" ]; then
                  echo "::error::Indica al menos un slug para reenviar."
                  exit 1
                fi
                node scripts/difundir.mjs --solo "${SLUGS}"
                ;;
            esac
          else
            node scripts/difundir.mjs --antes "${ANTES}" --despues "${DESPUES}"
          fi

      - name: Avisar por push
        # Independiente de Telegram: si uno falla, el otro ya ha salido (o sale igual).
        if: always()
        env:
          # Vale secreto o variable del repo: la URL estuvo guardada como secreto y el
          # paso se quedaba en verde sin avisar porque solo miraba `vars`.
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL || vars.PUSH_WORKER_URL }}
          PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN || vars.PUSH_SEND_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || vars.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT || 'https://acordesgaditanos.com' }}
          MODO: ${{ inputs.modo }}
          SLUGS: ${{ inputs.slugs }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Si falta la configuración no se puede avisar: que se vea en rojo. Antes
          # salía con 0 y una copla publicada se quedaba sin notificación sin rastro.
          faltan=""
          [ -n "${PUSH_WORKER_URL:-}" ] || faltan="${faltan} PUSH_WORKER_URL"
          [ -n "${PUSH_SEND_TOKEN:-}" ] || faltan="${faltan} PUSH_SEND_TOKEN"
          [ -n "${VAPID_PRIVATE_KEY:-}" ] || faltan="${faltan} VAPID_PRIVATE_KEY"
          if [ -n "${faltan}" ]; then
            echo "::error::Faltan${faltan} (secreto o variable del repo): el aviso push no ha salido."
            exit 1
          fi
          echo "Worker de push: ${PUSH_WORKER_URL}"

          # web-push no está en las dependencias: se instala solo para este paso.
          npm install --no-save --no-audit --no-fund web-push@3 >/dev/null 2>&1

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${MODO}" in
              prueba)
                node scripts/push.mjs --test
                ;;
              seco)
                if [ -n "${SLUGS}" ]; then
                  node scripts/push.mjs --solo "${SLUGS}" --dry-run
                else
                  node scripts/push.mjs --antes HEAD~1 --dry-run
                fi
                ;;
              reenviar)
                node scripts/push.mjs --solo "${SLUGS}"
                ;;
            esac
          else
            node scripts/push.mjs --antes "${ANTES}" --despues "${DESPUES}"
          fi
