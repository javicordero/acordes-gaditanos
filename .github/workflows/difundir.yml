name: Avisar de coplas nuevas

# Solo cuando un push a master añade ficheros en src/content/acordes.
# El script vuelve a comprobar que sean .md NUEVOS: editar una copla no avisa.
on:
  push:
    branches: [master]
    paths:
      - 'src/content/acordes/**'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué hacer'
        type: choice
        default: prueba
        options:
          - prueba
          - seco
          - reenviar
      slugs:
        description: 'Slugs para reenviar o previsualizar, separados por comas (opcional en modo seco)'
        required: false

permissions:
  contents: read

concurrency:
  group: difundir-telegram
  cancel-in-progress: false

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # Hace falta el commit anterior para saber qué se ha añadido.
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar el aviso
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@acordesgaditanos' }}
          MODO: ${{ inputs.modo }}
          SLUGS: ${{ inputs.slugs }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Ejecución manual en modo: ${MODO}"

            case "${MODO}" in
              prueba)
                node scripts/difundir.mjs --test
                ;;
              seco)
                if [ -n "${SLUGS}" ]; then
                  node scripts/difundir.mjs --solo "${SLUGS}" --dry-run
                else
                  node scripts/difundir.mjs --antes HEAD~1 --dry-run
                fi
                ;;
              reenviar)
                if [ -z "${SLUGS}" ]; then
                  echo "::error::Indica al menos un slug para reenviar."
                  exit 1
                fi
                node scripts/difundir.mjs --solo "${SLUGS}"
                ;;
            esac
          else
            node scripts/difundir.mjs --antes "${ANTES}" --despues "${DESPUES}"
          fi

      - name: Avisar por push
        # Independiente de Telegram: si uno falla, el otro ya ha salido (o sale igual).
        if: always()
        env:
          PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
          PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          MODO: ${{ inputs.modo }}
          SLUGS: ${{ inputs.slugs }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${PUSH_SEND_TOKEN:-}" ] || [ -z "${PUSH_WORKER_URL:-}" ]; then
            echo "Sin PUSH_SEND_TOKEN / PUSH_WORKER_URL: no se avisa por push."
            exit 0
          fi

          # web-push no está en las dependencias: se instala solo para este paso.
          npm install --no-save --no-audit --no-fund web-push@3 >/dev/null 2>&1

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${MODO}" in
              prueba)
                node scripts/push.mjs --test
                ;;
              seco)
                if [ -n "${SLUGS}" ]; then
                  node scripts/push.mjs --solo "${SLUGS}" --dry-run
                else
                  node scripts/push.mjs --antes HEAD~1 --dry-run
                fi
                ;;
              reenviar)
                node scripts/push.mjs --solo "${SLUGS}"
                ;;
            esac
          else
            node scripts/push.mjs --antes "${ANTES}" --despues "${DESPUES}"
          fi
